url: https://ian-flores.github.io/securetools/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#f4ecdc"
    fg: "#2b1f12"
    primary: "#bf5a36"
    secondary: "#3f5d72"
    success: "#7c8a4e"
    warning: "#d4a03c"
    border-radius: 0
    border-color: "#cdb48a"
    base_font: {google: "Hanken Grotesk"}
    heading_font: {google: {family: "Fraunces", wght: [400, 500, 600]}}
    code_font: {google: "Space Mono"}
    font-size-base: 1.02rem
    line-height-base: 1.65

reference:
- title: File I/O
  desc: Tools for reading and writing files with path scoping and size limits.
  contents:
  - tool_read_file
  - tool_write_file

- title: Database
  desc: Structured database queries with parameterized filters.
  contents:
  - tool_query_sql

- title: Data Analysis
  desc: Tools for data profiling, calculation, and visualization.
  contents:
  - tool_data_profile
  - tool_calculator
  - tool_plot

- title: Web
  desc: HTTP fetch with domain allow-lists and rate limiting.
  contents:
  - tool_fetch_url

- title: Documentation
  desc: R help documentation lookup.
  contents:
  - tool_r_help

- title: Guardrail Composition
  desc: Wrap tools with secureguard guardrails on input and output.
  contents:
  - guarded_tool
  - with_guards

articles:
- title: Getting Started
  contents:
  - securetools
- title: Integration
  contents:
  - agent-integration
  - data-analyst-agent

footer:
  structure:
    left: titleblock
    right: built_with
  components:
    titleblock: >-
      <div class="title-block">
      <div><b>Sheet</b>3 of 4</div>
      <div><b>Quadrangle</b>securetools</div>
      <div><b>Survey</b>Tools</div>
      <div><b>Series</b>secure-r-dev</div>
      </div>
